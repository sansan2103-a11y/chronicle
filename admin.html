<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>この管理コンソールは移転しました</title>
<!-- =====================================================================
     ADMIN_RETIREMENT_PAGE v1   (lane 16 / GPT 裁定 #L16entry Q1)
     設置先 = **player origin の admin.html**（= 旧 origin の同じ path）。
     候補ファイル。deploy していない。Owner 確認前に production へ出さない。

     このページの唯一の仕事は 3 つ:
       (i)  旧 origin の localStorage に残る admin key を **削除する**
       (ii) 新しい admin origin への案内を出す
       (iii) token logic を 1 行も持たない

     ★なぜ新 origin 側で掃除できないのか（設計上の要点）
       origin が違えば localStorage は別の貯蔵庫になる。
       新 admin origin から旧 origin の `chrAdminTok` は **読むことも消すこともできない**。
       したがって「旧 key の掃除」は **旧 origin で動くページ**にしかできない。
       404 にしてしまうと掃除の機会が永久に失われ、しかも bookmark も壊れる。
       → 旧 path は 404 ではなく **この退役ページ**にする。

     ★削除対象 key（/tmp/chron_ux4/admin.html を grep した実測 3 種）
       chrAdminTok      admin.html:210 (読み) / :229 (書き)   ← admin token 平文
       chrAdminUrl      admin.html:211 (読み) / :230 (書き)   ← Worker URL
       chrAdminPaidBal  admin.html:410 (読み) / :418 (書き)   ← 残高の前回観測値
       （念のため、接頭辞 `chrAdmin` の key を全て列挙して消す。
         player 側の key は `v292*` / `chr_*` 系で、`chrAdmin` 接頭辞は admin.html 専用。）

     ★このページが **しない**こと
       - token を読まない・保持しない・表示しない・送らない
       - fetch を 1 回もしない（`/admin` も `/save` も呼ばない）
       - `x-admin-token` という文字列を **コード中に持たない**
         （このコメント中の言及だけ。PLAYER_BUNDLE_ADMIN_LEAK_LINT の
           コメント除外規則により blocking hit にならない）
     ===================================================================== -->
<style>
  :root{--bg:#0d0d1a;--fg:#d6d7ee;--muted:#8b8caa;--accent:#7a7ac0;--card:#16162a;--ok:#4fb477}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);
    font:15px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:640px;margin:0 auto;padding:40px 20px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:24px}
  .card{background:var(--card);border:1px solid #26264a;border-radius:10px;padding:16px 18px;margin:14px 0}
  a.go{display:inline-block;margin-top:6px;padding:10px 16px;border-radius:8px;
    background:var(--accent);color:#fff;text-decoration:none;font-weight:600}
  code{background:#1f1f3a;padding:1px 5px;border-radius:4px;font-size:12px}
  .done{color:var(--ok);font-size:13px}
  ul{margin:8px 0 0;padding-left:20px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>この管理コンソールは移転しました</h1>
  <div class="sub">Chronicle 運営コンソール / 旧 URL（プレイヤー用サイトと同じ場所）</div>

  <div class="card">
    <div>新しい場所はこちらです。ブックマークを更新してください。</div>
    <!-- ★ADMIN_ORIGIN_PLACEHOLDER
         これは **template** である。下の href は置換トークン 1 個だけを持つ。
         deploy 可能な admin.html を作るのは M/derive_admin_retire_v1.mjs --admin-url <url>
         であり、そのトークンが **ちょうど 1 回**現れることを確認してから置換する
         （0 回 / 2 回以上なら異常終了して何も書かない）。
         入る値は Owner が作る Cloudflare Pages project の公開 URL である。
         この値は秘密ではない。token（ADMIN_TOKEN）は一切含めない・含めてはならない。 -->
    <a class="go" id="newLink" href="https://chronicle-admin.pages.dev/">新しい管理コンソールを開く</a>
    <div style="margin-top:10px;font-size:12px;color:var(--muted)">
      新しいコンソールはプレイヤー用サイトとは<strong>別の origin</strong> です。
      そのため、プレイヤー画面のスクリプトからは管理トークンを読み取れません。
    </div>
  </div>

  <div class="card">
    <div>この端末（プレイヤー用サイト側）に残っていた管理用の保存データを削除します。</div>
    <div id="result" class="done">…</div>
    <ul>
      <li>プレイヤーの物語・キャラクター・設定には一切触れません。</li>
      <li>削除するのは <code>chrAdmin</code> で始まるキーだけです。</li>
    </ul>
  </div>
</div>

<script>
/* 掃除は 1 回だけ。読み取りは「どのキーが残っているか」を数えるためで、
   値は 1 バイトも変数に入れない・表示しない・送らない。 */
(function () {
  var KNOWN = ['chrAdminTok', 'chrAdminUrl', 'chrAdminPaidBal'];
  var removed = [];
  try {
    /* 1. 既知の 3 キー */
    for (var i = 0; i < KNOWN.length; i++) {
      if (localStorage.getItem(KNOWN[i]) !== null) { localStorage.removeItem(KNOWN[i]); removed.push(KNOWN[i]); }
    }
    /* 2. 取りこぼし防止: chrAdmin 接頭辞を総ざらい（key 名だけを見る。値は触らない） */
    var extra = [];
    for (var k = 0; k < localStorage.length; k++) {
      var key = localStorage.key(k);
      if (key && key.indexOf('chrAdmin') === 0 && KNOWN.indexOf(key) < 0) extra.push(key);
    }
    for (var j = 0; j < extra.length; j++) { localStorage.removeItem(extra[j]); removed.push(extra[j]); }
    /* 3. 旧ページが sessionStorage を使っていた可能性への保険 */
    try { for (var m = sessionStorage.length - 1; m >= 0; m--) {
      var sk = sessionStorage.key(m);
      if (sk && sk.indexOf('chrAdmin') === 0) { sessionStorage.removeItem(sk); removed.push('session:' + sk); }
    } } catch (e) {}
  } catch (e) {
    document.getElementById('result').textContent = 'この端末では保存領域を読めませんでした（プライベートモード等）。削除は不要です。';
    return;
  }
  document.getElementById('result').textContent = removed.length
    ? ('削除しました: ' + removed.join(' / '))
    : 'この端末には管理用の保存データは残っていませんでした。';
})();
</script>
</body>
</html>
