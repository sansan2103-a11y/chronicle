<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Chronicle — 絵の確認（読み取り専用）</title>
<!--
  ★P3 candidate (ASSET_PORTRAIT_INSPECTION_SURFACE_MISSING): read-only portrait inspection surface.
  Design rules (measured in the offline fixture, see XDEV P3 evidence):
    - standalone page: NO story engine, NO legacy module (features.js / fix402 / fix634 / fix135 / fix697 / __aiAvatar are not loaded)
    - reads only: getstory (names ← bindings), portrait.list, portrait.candidates, asset.get (bytes). No write op exists on this page.
    - no localStorage / sessionStorage access at all (nothing to leak, nothing to sync, no package / meta push can be triggered)
    - auth = the HttpOnly session cookie (same-origin /api, x-chronicle-csrf: 1) — identical transport to fix893, no credential in JS
    - no external origin: images arrive as bytes from asset.get and are shown via blob: URLs (no Pollinations / provider URL is ever built)
    - adopt / regenerate / ensure_first are intentionally absent (a later, separate gate)
-->
<style>
  :root { color-scheme: dark; --bg:#141418; --fg:#eee; --dim:#9a9aa8; --card:#1f1f26; --line:#33333f; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; }
  header { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .ro { font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:999px; padding:2px 8px; }
  main { padding:16px; max-width:900px; margin:0 auto; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; }
  .card img { width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:8px; background:#2a2a33; display:block; }
  .card .name { margin-top:8px; font-size:14px; font-weight:600; word-break:break-all; }
  .card .meta { font-size:11px; color:var(--dim); margin-top:2px; word-break:break-all; }
  .cands { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .cands img { width:44px; height:44px; border-radius:6px; object-fit:cover; background:#2a2a33; opacity:.85; }
  .msg { color:var(--dim); font-size:13px; padding:12px 0; }
  a.back { color:#b39ddb; text-decoration:none; font-size:13px; }
</style>
</head>
<body>
<header><a class="back" href="home.html">← ホーム</a><h1>絵の確認</h1><span class="ro">読み取り専用 — ここでは何も生成・保存しません</span></header>
<main>
  <div id="msg" class="msg">読み込み中…</div>
  <div id="grid" class="grid"></div>
</main>
<script>
(function(){
  'use strict';
  var API = '/api/save';
  function post(body){
    return fetch(API, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'x-chronicle-csrf': '1' }, body: JSON.stringify(body) });
  }
  function json(body){ return post(body).then(function(r){ return r.json().then(function(j){ j.__status = r.status; return j; }); }); }
  function bytes(body){ return post(body).then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.blob(); }); }
  var msg = document.getElementById('msg'), grid = document.getElementById('grid');
  var sid = (new URLSearchParams(location.search).get('story') || '').trim();
  if (!/^[A-Za-z0-9]{6,32}$/.test(sid)) { msg.textContent = '物語が指定されていません（?story=<id>）。'; return; }
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  /* ★audit P3 D1/D6: revoke the object URL on load AND on error; at most 3 asset.get in flight (reads are not rate-limited server-side) */
  var inflight = 0, queue = [];
  function pump(){ while (inflight < 3 && queue.length){ var job = queue.shift(); inflight++; job(function(){ inflight--; pump(); }); } }
  function img(assetId, into){
    queue.push(function(done){
      bytes({ op: 'asset.get', asset_id: assetId }).then(function(b){
        var u = URL.createObjectURL(b);
        var fin = function(){ try { URL.revokeObjectURL(u); } catch(e){} into.onload = into.onerror = null; };
        into.onload = fin; into.onerror = function(){ fin(); into.alt = '表示できませんでした'; };
        into.src = u;
      }).catch(function(){ into.alt = '取得できませんでした'; }).then(done, done);
    });
    pump();
  }
  json({ op: 'getstory', id: sid, clientCanonicalSchemaMax: 2 }).then(function(s){
    if (s.__status === 401) { msg.textContent = 'ログインが必要です。ホームからログインしてください。'; return; }
    var names = Object.create(null);   // character_id -> [names]  (★audit P3 D5: no prototype keys)
    try {
      var b = (s.record && s.record.body) || s.body || null;
      var bind = (b && b.bindings) || {};
      Object.keys(bind).forEach(function(n){ var id = bind[n]; (names[id] = names[id] || []).push(n); });
      var cast = b && b.cast; if (cast && cast.hero && cast.hero.character_id && cast.hero.name) (names[cast.hero.character_id] = names[cast.hero.character_id] || []).unshift(cast.hero.name);
    } catch (e) {}
    return json({ op: 'portrait.list', story_id: sid }).then(function(l){
      if (l.__status === 401) { msg.textContent = 'ログインが必要です。ホームからログインしてください。'; return; }
      var code = l.errorCode || l.error || l.__status;   /* ★audit P3 D2: module errors carry `error`, legacy ops carry `errorCode` */
      if (!l.ok) { msg.textContent = code === 'ASSET_V2_DISABLED' ? 'この物語ではまだ絵の機能が使えません。' : (code === 'NOT_FOUND' || l.__status === 404) ? 'この物語は見つかりません。' : '一覧を取得できませんでした（' + code + '）'; return; }
      var rows = l.portraits || [];
      if (!rows.length) { msg.textContent = 'この物語にはまだ確定した絵がありません。'; return; }
      msg.textContent = rows.length + ' 件';
      rows.forEach(function(p){
        var c = el('div', 'card'); var im = el('img'); im.alt = ''; c.appendChild(im); img(p.asset_id, im);
        var nm = (names[p.character_id] || []); var uniq = nm.filter(function(x, i){ return nm.indexOf(x) === i; });
        c.appendChild(el('div', 'name', uniq.join(' / ') || '（名前未登録）'));
        c.appendChild(el('div', 'meta', 'rev ' + p.rev + ' · ' + p.asset_id));
        var cw = el('div', 'cands'); c.appendChild(cw);
        json({ op: 'portrait.candidates', story_id: sid, character_id: p.character_id }).then(function(cs){
          if (!cs.ok || !cs.items || !cs.items.length) return;
          cs.items.forEach(function(it){ var t = el('img'); t.alt = ''; t.title = it.derived + ' · ' + it.asset_id; cw.appendChild(t); img(it.asset_id, t); });
        }).catch(function(){});
        grid.appendChild(c);
      });
    });
  }).catch(function(e){ msg.textContent = '取得できませんでした。'; });
})();
</script>
</body>
</html>
