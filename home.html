<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>CHRONICLE — ホーム</title>
<!--
  P2-b/P2-d ホーム画面 (2026-07-25)
  設計書「P2: ホーム画面 + 物語ID(URL)方式」§4/§6.5/§8.1 に対応。
  ★重要な設計上の約束:
    1) このページは features.js / S を一切読み込まない。保存済みJSONを"読むだけ"。
       → ホームを開いただけでセーブが書き換わることが原理的に起こらない。
    2) 取り込み(pull)はこのページでだけ行う。物語がメモリに載っていないので衝突しない。
       ただし「この端末の方がターン数が多い物語」は上書きしない(local-ahead保護)。
    3) chr6_active_slot は書かない。物語は index.html?story=<id> で開く(URLが真実)。
-->
<style>
  :root{
    --bg:#080810; --bg2:#0d0d18; --panel:#11111f; --line:rgba(139,118,240,.18);
    --tx:#e2e0f2; --dim:#8f93bb; --acc:#c9a44c; --acc2:#8b76f0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--tx);font:14px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif;
       display:flex;flex-direction:column;overflow:hidden}
  button{font-family:inherit}
  a{color:inherit}

  header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);
         background:linear-gradient(180deg,#0b0b16,#080810)}
  .logo{font:600 17px/1 "Georgia",serif;letter-spacing:.16em;color:var(--tx)}
  .logo small{display:block;font:400 9px/1.6 system-ui;letter-spacing:.3em;color:var(--dim);margin-top:3px}
  .spacer{flex:1}
  .sync{font-size:12px;color:var(--dim);white-space:nowrap}
  .sync.err{color:#e08a8a}

  main{flex:1;display:flex;min-height:0}
  aside{width:210px;flex:none;padding:18px 14px;border-right:1px solid var(--line);overflow:auto}
  .newbtn{width:100%;padding:12px;border-radius:10px;border:1px solid var(--acc);
          background:linear-gradient(180deg,#d8b45c,#b8923c);color:#1a1408;font-weight:700;font-size:14px;cursor:pointer}
  .newbtn:hover{filter:brightness(1.07)}
  .navttl{margin:22px 0 8px;font-size:11px;letter-spacing:.12em;color:var(--dim)}
  .nav{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;
       cursor:pointer;color:var(--tx);font-size:13px}
  .nav:hover{background:rgba(139,118,240,.10)}
  .nav.on{background:rgba(139,118,240,.18)}
  .nav b{font-weight:400;color:var(--dim);font-size:12px}
  .recent{margin-top:6px}
  .recent .r{display:flex;gap:9px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer}
  .recent .r:hover{background:rgba(139,118,240,.10)}
  .recent .rc{width:34px;height:26px;border-radius:5px;flex:none;background:#1a1a2c;background-size:cover;background-position:center}
  .recent .rt{font-size:12px;line-height:1.35;overflow:hidden}
  .recent .rt span{display:block;color:var(--dim);font-size:11px}
  .data{display:flex;flex-direction:column;gap:6px}
  .data button{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);
       color:var(--dim);font-size:12px;cursor:pointer;text-align:left}
  .data button:hover{color:var(--tx);border-color:var(--acc2)}

  section.mid{flex:1;min-width:0;padding:18px 20px;overflow:auto}
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .h1{font-size:17px;font-weight:600;margin-right:auto}
  input.search,select.sort{background:var(--bg2);color:var(--tx);border:1px solid var(--line);
       border-radius:9px;padding:8px 12px;font-size:13px;font-family:inherit}
  input.search{min-width:180px}
  input.search:focus,select.sort:focus{outline:none;border-color:var(--acc2)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;
        transition:transform .12s,border-color .12s;position:relative}
  .card:hover{transform:translateY(-2px);border-color:rgba(139,118,240,.5)}
  .card.sel{border-color:var(--acc)}
  .cover{height:132px;background:#161628;background-size:cover;background-position:center;position:relative;overflow:hidden}
  .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s}
  .cover img.on{opacity:1}
  .cover .badge{position:absolute;top:8px;left:8px;font-size:10px;padding:3px 8px;border-radius:5px;
        background:rgba(8,8,16,.72);color:var(--tx);letter-spacing:.06em}
  .cbody{padding:11px 13px 13px}
  .ctitle{font-size:14px;font-weight:600;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .csum{font-size:11.5px;color:var(--dim);height:32px;overflow:hidden;line-height:1.4}
  .cchars{display:flex;align-items:center;gap:5px;margin:9px 0 8px;font-size:11px;color:var(--dim)}
  .av{width:21px;height:21px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
      font-size:10px;color:#0c0c14;font-weight:700}
  .cfoot{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);
         border-top:1px solid rgba(139,118,240,.12);padding-top:8px}
  .newcard{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:236px;
           border:1px dashed rgba(139,118,240,.32);border-radius:12px;color:var(--dim);cursor:pointer;background:transparent}
  .newcard:hover{border-color:var(--acc);color:var(--tx)}
  .newcard .plus{font-size:26px;margin-bottom:8px;opacity:.75}

  .detail{width:308px;flex:none;border-left:1px solid var(--line);padding:18px;overflow:auto}
  .dcover{height:150px;border-radius:10px;background:#161628;background-size:cover;background-position:center;margin-bottom:14px}
  .dtitle{font-size:17px;font-weight:600;margin-bottom:12px}
  .drow{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;color:var(--dim)}
  .drow b{font-weight:400;color:var(--tx)}
  .play{width:100%;margin:16px 0 8px;padding:13px;border-radius:10px;border:1px solid var(--acc);
        background:linear-gradient(180deg,#d8b45c,#b8923c);color:#1a1408;font-weight:700;font-size:14px;cursor:pointer}
  .play:hover{filter:brightness(1.07)}
  .mini{display:flex;gap:8px;margin-top:6px}
  .mini button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);
        color:var(--dim);font-size:12px;cursor:pointer}
  .mini button:hover{color:var(--tx);border-color:var(--acc2)}
  .mini button.danger:hover{color:#e08a8a;border-color:#a05a5a}
  .dsec{margin-top:18px;font-size:11px;letter-spacing:.1em;color:var(--dim);border-top:1px solid var(--line);padding-top:12px}
  .ch{display:flex;gap:9px;margin-top:10px}
  .ch .nm{font-size:12.5px;font-weight:600}
  .ch .rl{font-size:10.5px;color:var(--acc2);margin-left:5px}
  .ch .ds{font-size:11px;color:var(--dim);line-height:1.45}
  .empty{color:var(--dim);font-size:13px;padding:40px 0;text-align:center;grid-column:1/-1}
  .note{margin-top:12px;padding:10px 12px;border-radius:8px;background:rgba(224,138,138,.10);
        border:1px solid rgba(224,138,138,.3);font-size:12px;color:#e6b4b4}
  @media(max-width:980px){ .detail{display:none} aside{width:168px} }
  /* ★★fix601(2026-07-27・実機で発覚): ここは `aside{display:none}` だった。
     左パネルの中に「☁ いま上げる／☁ いま取り込む／＋ 新しい物語を始める」が入っているので、
     **スマホでは同期ボタンに一切さわれない**状態だった（2台テストが物理的にできない）。
     → 隠すのをやめ、**上に畳んで横並び**にする。
       一覧を圧迫しないよう、ライブラリ／最近プレイだけを畳む。 */
  @media(max-width:640px){
    main{flex-direction:column}
    aside{display:block;width:auto;flex:none;border-right:none;border-bottom:1px solid var(--line);
          padding:10px 12px;overflow:visible}
    aside #ttlLib, aside #navs, aside #ttlRecent, aside #recent{display:none}
    aside #ttlData{margin:12px 0 6px}
    .newbtn{padding:10px;font-size:13px}
    .data{flex-direction:row;flex-wrap:wrap;gap:8px}
    .data button{flex:1 1 calc(50% - 4px);text-align:center;padding:10px 8px}
    section.mid{padding:14px}
  }
  /* ★fix662(A): 画面最上部の通知帯（スクロール不要で必ず目に入る位置） */
  #note{ margin:0 }
  #note .note{ margin:0; padding:10px 16px; border-bottom:1px solid rgba(255,255,255,.12);
               background:rgba(74,122,208,.10); font-size:13px; line-height:1.7 }
  #note .note b{ color:#ffd9a0 }
  #note .more{ cursor:pointer; text-decoration:underline; opacity:.8 }
</style>
</head>
<body>

<header>
  <div class="logo">CHRONICLE<small>Third Universe</small></div>
  <div class="spacer"></div>
  <div class="sync" id="sync"></div>
</header>

<!-- ★★fix662(A): 取り込みの診断・警告・自動確保の報告は**画面最上部**に出す。
     2026-08-02 の実機で、⚠も診断行も一覧の下に出ていたためユーザーの目に入っていなかった。
     「黙って失敗しない」は、出す位置まで含めて初めて成り立つ。 -->
<div id="note"></div>

<main>
  <aside>
    <button class="newbtn" id="newBtn">＋ 新しい物語を始める</button>
    <div class="navttl" id="ttlLib">ライブラリ</div>
    <div id="navs"></div>
    <div class="navttl" id="ttlRecent">最近プレイした物語</div>
    <div class="recent" id="recent"></div>
    <div class="navttl" id="ttlData">データ</div>
    <div class="data">
      <button id="upBtn" title="この端末の内容をクラウドの正にします">☁ いま上げる</button>
      <button id="downBtn" title="クラウドの内容をこの端末へ取り込みます（この端末の方が進んでいる物語は守られます）">☁ いま取り込む</button>
      <button id="expBtn" title="この端末の全データをJSONファイルに書き出します">⬇ 書き出す</button>
      <button id="impBtn" title="書き出したJSONファイルから復元します">⬆ 取り込む</button>
      <input type="file" id="impFile" accept="application/json,.json" style="display:none">
      <!-- ★fix660: 容量の恒久対処。自動GCだけでは足りない（iPhone実データでは597KBの唯一の
           fullDumpが最大占有者で、これは自動では絶対に消さない）。利用者が中身を見て選ぶ。 -->
      <button id="gcBtn" title="使っていない控えを一覧から選んで解放し、保存容量を空けます">🧹 容量を空ける</button>
    </div>
    <div id="capMeter" style="margin-top:6px;font-size:11px;opacity:.7;line-height:1.5"></div>
  </aside>

  <section class="mid">
    <div class="bar">
      <div class="h1" id="listTitle">すべての物語</div>
      <select class="sort" id="sort">
        <option value="updated">並べ替え：更新日時</option>
        <option value="turns">ターン数</option>
        <option value="name">名前</option>
        <option value="created">作成日</option>
      </select>
      <input class="search" id="q" placeholder="検索（名前・場所・主人公）">
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <div class="detail" id="detail"></div>
</main>

<!-- ★fix587: 物語削除の正規サービス一式。home.html は本来スクリプトを読まないページだが、
     削除だけは「墓標→クラウド反映→ゲート経由でexact削除」の順序を守る必要があるため、
     必要最小限（削除ゲート→分類器→スナップショット→墓標→サービス）だけを積む。
     ★fix569 が最初でなければならない（他が localStorage をラップする前に native を捕まえる）。
     クラウドへのpush(fix399)はここには載せない。反映できないときは
     「一覧からは消すが実データの削除は保留」となり、アプリ側で自動的に片づく。 -->
<script>
/* ★fix592: ホーム画面にも「古いHTMLキャッシュからの脱出」を入れる。
   index.html には fix242 で同じ仕組みが入っていたが、home.html には無かった。
   2026-07-27 の実機で実際に踏んだ: fix591（取り込みで墓標を消さない修正）を出荷した直後、
   ブラウザが**古い home.html を使い続け**、修正が効かないまま「削除した物語が一覧に戻る」が再現した。
   → version.txt を no-store で見て、このHTMLの BUILT と違えば一度だけ ?vr=1&v=最新 で置換リロードする。
   ?vr=1 でループ防止。fetch 失敗時は現状維持（安全側）。 */
(function(){
  var HOME_BUILT = '20260802-fix662';
  try {
    if (/[?&]vr=1/.test(location.search)) return;
    fetch('version.txt?_=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.text() : ''; })
      .then(function(v){
        v = (v || '').trim().slice(0, 40);
        if (!v || v === HOME_BUILT) return;
        var sep = location.search ? '&' : '?';
        location.replace(location.pathname + location.search + sep + 'vr=1&v=' + encodeURIComponent(v));
      })
      .catch(function(){});
  } catch(e){}
})();
</script>
<!-- v292Dfix654: iOS Safari は `localStorage.getItem = fn` のインスタンス代入が効かない
     （Storage の named-setter 挙動。own property が作られず、prototype の native が先に解決される）。
     Storage.prototype を accessor 化して以後の全モジュールの代入を捕獲する。**最初の script**。
     OFF=v292Dfix654Off -->
<script src="v292Dfix654-storage-trap.js?cb=v292Dfix662"></script>
<script src="v292Dfix569-gc-shadow.js?cb=v292Dfix662"></script>
<!-- ★fix660(A): DeleteGateway。物理削除の唯一の実行者（fix569 が捕捉済みの native を借りる） -->
<script src="v292Dfix660-delete-gateway.js?cb=v292Dfix662"></script>
<script src="v292Dfix562-backup-inventory.js?cb=v292Dfix662"></script>
<script src="v292Dfix564-snapshot.js?cb=v292Dfix662"></script>
<!-- ★fix660(B): BackupGC。削除候補を選ぶ層。分類は fix562 が唯一の正なのでその後ろ -->
<script src="v292Dfix660-backup-gc.js?cb=v292Dfix662"></script>
<script src="v292Dfix579-tombstone-schema.js?cb=v292Dfix662"></script>
<script src="v292Dfix590-commit-ledger.js?cb=v292Dfix662"></script>
<script src="v292Dfix587-story-lifecycle.js?cb=v292Dfix662"></script>
<!-- ★fix602: 墓標が立ったスロットへの書き込みを影で止める（別途配信） -->
<script src="v292Dfix602-tombstone-write-shadow.js?cb=v292Dfix662"></script>
<!-- ★fix642: 停止中の削除(blocked-stale-legacy)を、クラウド墓標の read-back を根拠に
     新しい planId で作り直して完遂する。**操作専用・自動実行なし**（コンソールから呼ぶ） -->
<script src="v292Dfix642-delete-readback.js?cb=v292Dfix662"></script>
<!-- ★fix658 Phase1: 系譜センサス（shadow）。同期の競合を「早送りか本物の分岐か」で分類して
     数えるだけ。ダイアログ・取り込み・送信の挙動は1つも変えない。書込先は
     v292Dfix658_anchor / v292Dfix658_census の2キーのみ。
     観測=window.__v292Dfix658.status()/.census()/.selfTest() / OFF=v292Dfix658Off -->
<script src="v292Dfix658-lineage-shadow.js?cb=v292Dfix662"></script>
<script>
(function(){
  'use strict';
  var LS = window.localStorage;
  function g(k){ try { return LS.getItem(k); } catch(e){ return null; } }
  /* ★fix660: 書込失敗を**無言にしない**。iPhone(2632KB/565キー)で実際に起きたのは、
     home の pull が96ターンの本体だけを静かに書けず、それでも「取り込みました」と
     表示していたこと。失敗の理由(QuotaExceededError 等)をここで必ず残す。 */
  var lastWriteError = null;
  function s(k,v){ try { LS.setItem(k,v); lastWriteError = null; return true; }
                   catch(e){ lastWriteError = { key:k, name:(e && (e.name||e.code)) || 'UnknownError',
                                                message:String((e && e.message) || e).slice(0,120),
                                                bytes:(v==null?0:String(v).length) }; return false; } }
  function isQuotaError(e){ var n = String((e && (e.name||e.code)) || ''); 
    return /Quota|QUOTA_EXCEEDED|NS_ERROR_DOM_QUOTA/i.test(n); }
  function J(v,d){ try { return JSON.parse(v); } catch(e){ return d; } }
  function el(id){ return document.getElementById(id); }
  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  // ---------- データ読み取り（読むだけ・書き換えない） ----------
  function readMeta(){ var m = J(g('chr6_slots_meta'),[]); return Array.isArray(m)?m:[]; }
  function writeMeta(m){ return s('chr6_slots_meta', JSON.stringify(m)); }
  function slotKey(id){ return (id==='default'||id==='chr6') ? 'chr6' : ('chr6_slot_'+id); }
  function slotData(id){ var raw=g(slotKey(id)); return raw?J(raw,null):null; }
  function clean(t){ return String(t||'').replace(/【[^】]*】/g,' ').replace(/\s+/g,' ').trim(); }

  function hashN(t){ var h=0,x=String(t||''); for(var i=0;i<x.length;i++){ h=((h<<5)-h+x.charCodeAt(i))|0; } return Math.abs(h); }
  function coverPrompt(sc){
    if(!sc) return '';
    var parts=[clean(sc.loc), clean(sc.lore).slice(0,90), clean(sc.tone),
      'cinematic key art, atmospheric lighting, detailed, no text, no people, no watermark'];
    return parts.filter(Boolean).join(', ').slice(0,210);
  }
  function coverUrl(id, sc){
    var p = coverPrompt(sc); if(!p) return '';
    var seed = g('v292cover_seed_'+id) || String(hashN(p)%100000);   // 決定的＝毎回同じ絵＝ブラウザキャッシュが効く
    return 'https://image.pollinations.ai/prompt/'+encodeURIComponent(p)+
           '?width=600&height=375&nologo=true&model=flux&seed='+seed;   // 無料GET(Pollen非消費)
  }
  function gradient(t){ var h=hashN(t)%360; return 'linear-gradient(160deg,hsl('+h+',40%,22%),hsl('+((h+30)%360)+',44%,8%))'; }

  function story(m){
    var d = slotData(m.id) || {};
    var turns = (d.turns && d.turns.length) || 0;
    var hero = (d.cast && d.cast.hero) || null;
    var npcs = (d.cast && Array.isArray(d.cast.npcs)) ? d.cast.npcs : [];
    var upd = m.updatedAt ? Date.parse(m.updatedAt) : 0;
    return {
      id: String(m.id), name: String(m.name||'（無題）'),
      summary: m.summary || clean(d.scene && d.scene.lore).slice(0,44) || clean(d.scene && d.scene.loc),
      loc: clean(d.scene && d.scene.loc), hero: hero, npcs: npcs, turns: turns,
      updated: upd || 0, created: m.createdAt ? Date.parse(m.createdAt) : 0,
      opened: m.lastOpenedAt ? Date.parse(m.lastOpenedAt) : (upd||0),
      favorite: !!m.favorite, scene: d.scene || null, meta: m
    };
  }
  /* ★fix588: 墓標(tombstone)が立った物語は一覧に出さない。
     ここが抜けていた（fix587で墓標を立て始めたのに、表示側が墓標を知らなかった）:
       ・物理削除が保留(pending-cloud)のあいだ、本体がまだ残っているので
         再読込すると削除した物語がカードとして戻って見える
       ・完全に消えた後も、墓標エントリが「（無題）0ターン」の幽霊カードとして残る
     判定は fix579 を正本にし、未搭載時も自前で墓標を隠す（安全側）。
     ★誤って生きた物語を隠さないよう、条件は deleted===true かつ deleteOpId 有りに限る。 */
  /* OFF = localStorage['v292Dfix588Off']='1' … 一覧の除外と起動遮断だけを止める。
     ★削除の順序（墓標をクラウドへ確定させてから物理削除）と deleteOpId の再利用は
       これでは止まらない。「ロールバック設定がデータ削除保護を迂回してはいけない」(GPT)。 */
  function f588off(){ return g('v292Dfix588Off') === '1'; }
  /* ★GPT裁定(B): 隠す側は deleteOpId を要求しない。deleteOpId が欠けた「壊れた墓標」も
     **隠して止める**（ただし削除の再開や物理削除はしない=fix587側の責務）。

  function isTombstoneEntry(m){

  // 表紙は無料GET(image.pollinations.ai)。同時に殺到するとrate-limitされるので
  // カードごとに少しずらして読み、失敗したら間隔を空けて2回まで再試行する(fix310と同じ作法)。
  function mountCovers(root){
    var cs = (root||document).querySelectorAll('.cover[data-cover]');
    for (var i=0;i<cs.length;i++){
      (function(c, idx){
        var url = c.getAttribute('data-cover'); if(!url) return;
        c.removeAttribute('data-cover');
        var img = new Image(), tries = 0;
        img.alt='';
        img.addEventListener('load', function(){ if(img.naturalWidth>0) img.classList.add('on'); });
        img.addEventListener('error', function(){
          if(tries<2){ tries++; setTimeout(function(){ img.src = url+'&r='+tries+'_'+Date.now(); }, 1500*tries + Math.random()*800); }
        });
        c.appendChild(img);
        setTimeout(function(){ img.src = url; }, idx*420);
      })(cs[i], i);
    }
  }

  function ago(ms){
    if(!ms) return '—';
    var d = Date.now()-ms;
    if(d < 60000) return 'たった今';
    if(d < 3600000) return Math.floor(d/60000)+'分前';
    if(d < 86400000) return Math.floor(d/3600000)+'時間前';
    if(d < 172800000) return '昨日';
    if(d < 2592000000) return Math.floor(d/86400000)+'日前';
    return new Date(ms).toLocaleDateString('ja-JP');
  }
  function dt(ms){ return ms ? new Date(ms).toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—'; }

  function newStory(){

    /* ★★fix600: 新しい物語の**中身を空で先に作る**。

    try {

  function delStory(id){
    var m = readMeta().filter(function(x){ return x && String(x.id)===id; })[0];
    if(!m) return;
    var d = slotData(id); var t = (d&&d.turns&&d.turns.length)||0;
    if(!confirm('「'+(m.name||id)+'」（'+t+'ターン）を削除します。\nこの物語は一覧から消えます。よろしいですか？')) return;
    /* ★fix587: 削除の実行は**正規サービス**へ委譲する。
       ここで自前に消していた頃の問題:
         ・墓標(tombstone)が無いのでクラウドへ削除が伝わらず、次のpullで復活していた
         ・退避が本体1キーだけで、サイドストア（12家族）が戻せなかった
         ・idの部分一致で掃いていたので、範囲が経路ごとにバラバラだった
       正規サービスは「再読込→exact key確定→復元セット作成→検証→墓標→クラウドへ反映確認→
       ゲート経由でexact削除」の順で行う。**物理削除より先に墓標をクラウドへ確定させる**のが要。
       未搭載なら**削除しない**（旧実装へは戻さない）。 */
    var svc = null; try { svc = window.__chronicleStoryLifecycle; } catch(e){}
    if(!(svc && typeof svc.requestDelete === 'function')){
      alert('削除機能を安全な手順へ移行中です。少し待ってからもう一度お試しください。');
      return;
    }
    var p = svc.requestDelete(id, { source:'home' });
    Promise.resolve(p).then(function(r){
      if(!r || !r.ok){
        alert('削除できませんでした。データはそのまま残っています。\n理由: ' + ((r && r.code) || '不明'));
        return;
      }
      /* ★★fix595(GPT裁定 Q2): ホームは fix399(クラウド同期)を積んでいないので、
         ここでの削除は**必ず**「墓標は立てたがクラウドへ未反映」で終わる。
         旧文言「通信できるようになったら自動で片づきます」は、通信の問題だと誤解させる。
         実際に必要な行動は**ゲーム画面を一度開くこと**なので、そう書く。 */
      if(r.code === 'pending-cloud'){
        alert('一覧からは消しました。\nこの削除はまだ他の端末へ反映されていません。\nゲーム画面を一度開くと同期されます。');
      } else if(r.code === 'partial'){
        alert('一覧からは消しました。一部のデータが残っています（安全のため無理に消していません）。');
      }
      if(SEL===id) SEL=null;
      render(); pendingDeleteNotice();
    });
  }

  function proxyUrl(){ var u=(g('v292ProxyUrl')||'').trim(); return (u||'https://novel-proxy.sansan2103.workers.dev').replace(/\/+$/,''); }
  /* ★★fix601(2026-07-27・実機で発覚): Google の exp は**秒**、Date.now() は**ミリ秒**。
     ここが `t.exp*1 > Date.now()` と書かれていたため桁が1000倍ずれ、

  function authHeaders(){
    var h={'Content-Type':'application/json'};

    var t=J(g('v292GoogleToken'),null);
    if(t && t.token && (!t.exp || (t.exp*1000) > (Date.now()+30000))) h['x-google-id']=t.token;
    return h;
  }
  function loggedIn(){ var h=authHeaders(); return !!(h['x-google-id']||h['x-chronicle-pass']); }
  /* ★★fix601: 「なぜ同期できないのか」を必ず画面に出す。
     黙って return するのが一番たちが悪い（無反応にしか見えず、原因を追えない）。 */
  function whyNotLoggedIn(){

    if(!p && t && t.token) return 'Googleログインの有効期限が切れています。ゲーム画面でログインし直してください。';

  function call(body, ms){
    var ctrl = (typeof AbortController!=='undefined') ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ try{ctrl.abort();}catch(e){} }, ms||25000) : null;
    var o={ method:'POST', headers:authHeaders(), body:JSON.stringify(body) };
    if(ctrl) o.signal = ctrl.signal;
    return fetch(proxyUrl()+'/save', o).then(function(r){ if(timer) clearTimeout(timer); return r.json(); });
  }
  function turnsOf(raw){ var d=J(raw,null); return (d && Array.isArray(d.turns)) ? d.turns.length : -1; }

  /* ================= ★★fix602: ホームにも墓標(tombstone)バリアを配線する =================
   * ■なぜ必要か（2026-07-27 の実測で確定した真因）
   *   物語を削除すると `chr6_slots_meta` に墓標が立ち、本体とサイドストアは
   *   検証済みスナップショットを作ってから物理削除される。
   *   ところが **home.html の取り込み(pull)と送信(collectLS)にだけ墓標バリアが無かった**。
   *   fix587.filterIncoming / fix588 の除外は index.html 側（fix399 / fix402）にしか
   *   配線されておらず、実機では**墓標が立った後に本体へ2ターン書き足されていた**
   *   （12785B/4ターン → 18132B/6ターン）。つまり home が削除済みの物語を復活させていた。
   *
   * ■このブロックがやること
   *   (1) 取り込み: 墓標スロットのキーを**書き戻さない**
   *   (2) 送信    : 墓標スロットの本体・サイドストアを**送らない**（meta の墓標は送る）
   *   どちらも判定は fix587 の filterIncoming / fix562 の classifyKey を正本にする。
   *
   * ■文字列の部分一致を使わない理由
   *   墓標 `sm1` が、生きている `sm12` のキーを巻き込んで止めてしまうため。
   *   slotId は下の slotIdOfKey() で**正規化して完全一致**で比べる。
   *   引用符付きキー（chr6_v292Dfix54_genderMap_"smrxxxx"）もここで正しく扱う。
   *
   * OFF = localStorage['v292Dfix602Off']='1' … (1)(2)の**除外だけ**を止める。
   *   ★墓標そのもの・削除の順序（墓標をクラウドへ確定させてから物理削除）は OFF でも壊さない。
   *     「ロールバック設定がデータ削除保護を迂回してはいけない」(GPT)。
   * ===================================================================================== */
  function f602off(){ return g('v292Dfix602Off') === '1'; }
  function lifecycleSvc(){ try { return window.__chronicleStoryLifecycle; } catch(e){ return null; } }

  /* 互換用の内部スロットは 'chr6' と 'default' の2つの名前で現れる。同じものとして扱う。 */
  function normSlotId(id){ var s = String(id == null ? '' : id); return (s === 'default') ? 'chr6' : s; }

  /* meta にある墓標 id の集合。★OFF でも「墓標があるかどうか」は正しく答える
     （表示や中止判定は墓標の存在そのものを見るため）。 */
  function tombstonedIds(){
    var out = {};
    try {
      readMeta().forEach(function(e){
        if (e && e.deleted === true && e.id != null) out[normSlotId(e.id)] = 1;
      });
    } catch(e){}
    return out;
  }
  function hasTombstone(){ var d = tombstonedIds(); for (var k in d){ if (d.hasOwnProperty(k)) return true; } return false; }

  /* キー名から slotId を**正規化して**求める。決まらなければ null（そこでは判断しない）。
     ①本体キー ②引用符付きサイドストア(fix54系) ③`..._slot_<id>` 形 ④fix562 の分類器
     ★①〜③を分類器より先に見るのは、分類器の内部が「生きているスロットIDを含むか」の
       部分一致を使っており、墓標 sm1 の本体が残っている間は `..._"sm12"` を sm1 と
       取り違えうるため。形が確定しているキーは形で決める方が安全。 */
  function slotIdOfKey(k){
    var key = String(k == null ? '' : k);
    if (!key) return null;
    if (key === 'chr6') return 'chr6';
    var m = /^chr6_slot_([A-Za-z0-9]+)$/.exec(key);
    if (m) return normSlotId(m[1]);
    m = /_"([^"]+)"$/.exec(key) || /_'([^']+)'$/.exec(key);
    if (m) return normSlotId(m[1]);
    m = /_slot_([A-Za-z0-9]+)$/.exec(key);
    if (m) return normSlotId(m[1]);
    try {
      var c = window.__v292Dfix562;
      if (c && typeof c.classifyKey === 'function'){
        var r = c.classifyKey(key);
        if (r && r.slotId) return normSlotId(r.slotId);
      }
    } catch(e){}
    return null;
  }

  /* fix562 の分類器が実際に使えるか。使えないことは fix587 へ記録する（fail-open でも黙らない） */
  var f602NotedUnavailable = false;
  function classifierReady(){
    try {
      var c = window.__v292Dfix562;
      if (c && typeof c.classifyKey === 'function'){ c.classifyKey('chr6'); return true; }
    } catch(e){}
    if (!f602NotedUnavailable){
      f602NotedUnavailable = true;
      try { var s = lifecycleSvc();
            if (s && typeof s.noteFilterUnavailable === 'function') s.noteFilterUnavailable(); } catch(e){}
    }
    return false;
  }

  /* ---- (1) 取り込みの墓標バリア ------------------------------------------
   * 戻り: { mode, blocked:{key:1}, count, why }

       背景同期の fail-open（分類器が居なければ従来どおり送る）をここへ持ち込むと、
       削除済みの物語の本体がクラウドの正本として復活し、全端末へ配られる。
       → 墓標フィルタが使えず、かつローカルに墓標があるなら**送信そのものを中止**する。
       ★無言で return しない。理由を必ず画面に出す（黙る方が原因を追えない）。 */
    if(!f602off() && hasTombstone() && !classifierReady()){
      var why602 = '削除の記録を確認できないため、クラウドへの上書きを中止しました。'
                 + '削除した物語がほかの端末へ戻ってしまうのを防ぐためです。'
                 + 'ページを再読み込みしてからもう一度お試しください。';
      try { el('sync').className='sync err'; el('sync').textContent='⚠ 上げませんでした（削除の記録を確認できません）'; } catch(e){}
      try { el('note').innerHTML = '<div class="note">'+esc(why602)+'</div>'; } catch(e){}
      try { console.warn('[home][v292Dfix602] forceput中止:', 'forceput-blocked-tombstone-barrier-unavailable'); } catch(e){}
      alert(why602);
      return;
    }
    if(!confirm('この端末の内容をクラウドの「正」にします。\n他の端末の古い版は控えとして残ります。よろしいですか？')) return;
    el('sync').className='sync'; el('sync').textContent='☁ 上げています…';
    var pkg = { schema:1, updatedAt:Date.now(), device:(navigator.userAgent||'').slice(0,60),
                activeSlot:(J(g('chr6_active_slot'),'chr6')||'chr6'), ls:collectLS(), full:true };
    call({op:'meta'},15000).then(function(m){
      /* ★★fix596(GPT指定1): 「いま上げる」は forceput なので、**曖昧コミットはここでも起きる**。
         put と同じ commit ledger を通し、commitOpId を付けて送る。
         未解決の pending が残っているなら、上書きせずに中止する（前回の証拠を消さない）。 */
      var body596 = { op:'forceput', baseRev:(m&&m.rev)||0, pkg:pkg };
      var L596 = null; try { L596 = window.__v292Dfix590; } catch(e){}
      if (!(L596 && typeof L596.notePut === 'function')) return call(body596, 60000);
      var h596 = authHeaders();
      /* ★fix596c: identity は ns（アカウントの名前空間）を基準にする。
         Google トークンは期限切れで消えるので、ヘッダから作ると同じ人でも値が変わり、
         **自分の保留を自分で解決できなくなる**（実機で踏んだ）。 */
      /* ★★fix597(GPT指定): ns の**生値を localStorage へ保存しない**。
         保存するのは台帳が作る SHA-256 指紋だけ（v292Dfix597_nsfp）。生の ns はメモリのみ。
         この forceput は直前に op:'meta' を叩いているので、m.ns が最も新しい安定 identity。 */
      var ns596 = (m && m.ns) ? String(m.ns) : null;
      try { if (ns596 && L596 && typeof L596.learnNs === 'function') L596.learnNs(ns596); } catch(e){}
      try { localStorage.removeItem('v292Dfix596_ns'); } catch(e){}
      return L596.notePut({ pkg: pkg, baseRev: body596.baseRev, op: 'forceput',
                            pkgTs: (pkg && pkg.updatedAt) || null,
                            ns: ns596,
                            identity: (h596['x-google-id'] || h596['x-chronicle-pass'] || null),
                            identityKind: (h596['x-google-id'] ? 'google' : 'pass'),
                            source: 'home:forceput' })
        .then(function(pr596){
          if (pr596 && pr596.blocked){
            return { ok:false, error:'前回の送信の結果がまだ確認できていません。一度「いま取り込む」を実行してから、もう一度お試しください。',
                     errorCode:'pending-commit-unresolved' };
          }
          if (pr596 && pr596.ok && pr596.commitOpId) body596.commitOpId = pr596.commitOpId;
          return call(body596, 60000).then(function(res596){
            /* ★成功応答を ok:true だけで信用しない。台帳に判定させる。 */
            try {
              if (res596 && res596.ok && typeof L596.noteResult === 'function'){
                var v596 = L596.noteResult({ rev: res596.rev, source:'home:forceput', response: res596 });
                if (v596 && (v596.status === 'ambiguous-response' || v596.status === 'response-integrity-mismatch')){
                  return { ok:false, error:'サーバの応答の整合が取れませんでした（' + v596.status + '）。データは変更していません。一度「いま取り込む」を実行してください。',
                           errorCode: v596.status };
                }
              }
            } catch(e){}
            return res596;
          });
        });
    }).then(function(r){
      if(!r || !r.ok) throw new Error(r&&r.errorCode||'push');
      s('v292Dfix402_baseRev', String(r.rev));
      s('v292Dfix399_baseTs', String(pkg.updatedAt)); s('v292Dfix399_localTs', String(pkg.updatedAt));
      el('sync').textContent = '☁ 上げました（rev '+r.rev+'）';
      /* ★★fix602(4): 送信で墓標により除いた件数を画面とconsoleへ出す（黙って減らさない） */
      try {
        if(lastPayloadDropped){
          el('note').innerHTML = '<div class="note">'+esc('削除した物語のデータ '+lastPayloadDropped+' 件は、クラウドへ送っていません（削除の記録だけを送りました）。')+'</div>';
          console.log('[home][v292Dfix602] 送信から除外:', lastPayloadDropped, '件');
        }
      } catch(e){}
    }).catch(function(){ el('sync').className='sync err'; el('sync').textContent='☁ 上げられませんでした'; });
  }
  function exportAll(){
    var o={}; for(var i=0;i<LS.length;i++){ var k=LS.key(i); o[k]=g(k); }
    var body = JSON.stringify({ kind:'chronicle-device-backup', takenAt:new Date().toISOString(), keys:Object.keys(o).length, ls:o });
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([body],{type:'application/json'}));
    a.download='chronicle_backup_'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    el('sync').className='sync'; el('sync').textContent='⬇ 書き出しました（'+Object.keys(o).length+'件）';
  }
  function importFile(f){
    var fr=new FileReader();
    fr.onload=function(){
      var pkg=J(fr.result,null);
      var ls=(pkg&&pkg.ls)||(pkg&&pkg.data&&pkg.data.ls)||null;
      if(!ls){ alert('このファイルは読み込めませんでした。'); return; }
      var n=Object.keys(ls).length;
      if(!confirm('ファイルから '+n+' 件のデータを取り込みます。\n同じ名前のデータはファイルの内容で置き換わります。よろしいですか？')) return;
      var w=0;
      for(var k in ls){
        if(!Object.prototype.hasOwnProperty.call(ls,k)) continue;
        if(k==='chr6_active_slot') continue;            // 開いている物語は持ち込まない
        if(s(k, ls[k])) w++;
      }
      el('sync').className='sync'; el('sync').textContent='⬆ 取り込みました（'+w+'件）';
      render();
    };
    fr.readAsText(f);
  }
  /* ================= ★★fix660: 容量の恒久対処UI ==============================
   * ・容量メーター … いま何KB/何キー使っているかを常に見せる（黙って詰まらせない）
   * ・「🧹 容量を空ける」 … BackupGC が選んだ候補と、自動では消さない review-only を一覧で見せ、
   *   **利用者が選んだものだけ** DeleteGateway 経由で解放する。自動実行は一切しない。
   * ・唯一の fullDump（サイドストアごと復元できる最後の控え）には必ず警告文を出し、
   *   明示のチェックが無ければ解放しない。
   * ========================================================================= */
  function f660gc(){ try { return window.__v292Dfix660gc; } catch(e){ return null; } }
  function renderCapacity(){
    try {
      var box = el('capMeter'); if(!box) return;
      var gc = f660gc();
      if(!gc){ box.textContent = ''; return; }
      var st = gc.status();
      box.textContent = '保存容量: ' + st.usageKB + 'KB / ' + st.keys + 'キー';
      if(st.degradedSlots && st.degradedSlots.length){
        box.textContent += '（控えが弱い物語 ' + st.degradedSlots.length + ' 件）';
      }
    } catch(e){}
  }
  var gcRows = [];
  function openGcPanel(){
    var gc = f660gc();
    if(!gc){ el('note').innerHTML = '<div class="note">容量の整理機能を読み込めていません。ページを再読み込みしてください。</div>'; return; }
    var rv = null;
    try { gc.plan(); rv = gc.reviewCandidates(); } catch(e){ rv = null; }
    if(!rv){ el('note').innerHTML = '<div class="note">容量の棚卸しに失敗しました。安全のため何も消していません。</div>'; return; }
    gcRows = rv.rows || [];
    var h = ['<div class="note"><b>🧹 容量を空ける</b>（いま ' + rv.usage.kb + 'KB / ' + rv.usage.keys + 'キー）<br>'
           + esc(rv.note) + '<br>'];
    if(!gcRows.length){ h.push('解放できるものはありません。'); }
    var sel = gcRows.filter(function(r){ return r.auto || r.selectable; });
    for(var i=0;i<sel.length;i++){
      var r = sel[i];
      h.push('<label style="display:block;margin:6px 0"><input type="checkbox" data-gc="'+i+'"> '
        + '<b>'+r.kb+'KB</b> '+esc(r.family||'')+(r.slotId?('/'+esc(r.slotId)):'')+' — '+esc(r.why||'')
        + (r.warning?('<br><span style="color:#ffb4b4">'+esc(r.warning)+'</span>'):'')
        + '<br><span style="opacity:.6;font-size:11px">'+esc((r.keys||[]).join(', ')).slice(0,160)+'</span></label>');
    }
    gcRows = sel;
    var hardN = (rv.rows||[]).filter(function(r){ return r.protection==='hard'; }).length;
    if(hardN) h.push('<div style="opacity:.6;font-size:11px">※ 生きている物語そのもの '+hardN+' 件は、ここからは解放できません。</div>');
    h.push('<div style="margin-top:8px"><label><input type="checkbox" id="gcSole"> 唯一の丸ごと控えでも解放する（上級者向け）</label></div>');
    h.push('<button id="gcRun" style="margin-top:8px">選んだものを解放する</button> <button id="gcCancel" style="margin-top:8px">やめる</button></div>');
    el('note').innerHTML = h.join('');
    var run = el('gcRun'); if(run) run.addEventListener('click', runGcRelease);
    var cx = el('gcCancel'); if(cx) cx.addEventListener('click', function(){ el('note').innerHTML=''; });
  }
  function runGcRelease(){
    var gc = f660gc(); if(!gc) return;
    var ids = [], boxes = document.querySelectorAll('[data-gc]');
    for(var i=0;i<boxes.length;i++){
      if(boxes[i].checked){ var r = gcRows[+boxes[i].getAttribute('data-gc')]; if(r) ids.push(r.unitId); }
    }
    if(!ids.length){ alert('解放するものを選んでください。'); return; }
    var soleEl = el('gcSole');
    var allowSole = !!(soleEl && soleEl.checked);
    var risky = ids.filter(function(id){ var r=null; for(var j=0;j<gcRows.length;j++){ if(gcRows[j].unitId===id) r=gcRows[j]; } return r && r.warning; });
    if(risky.length && !allowSole){
      alert('選んだものの中に「復元の最後の手段」が含まれています。\nどうしても解放する場合は「唯一の丸ごと控えでも解放する」にチェックしてください。');
      return;
    }
    if(!confirm(ids.length+' 件を解放します。元に戻せません。よろしいですか？')) return;
    var res = gc.releaseApproved(ids, { allowSoleRestorePoint: allowSole });
    var msg = res.ok
      ? ('解放しました（'+res.released.length+' 件 / '+Math.round((res.freedBytes||0)/1024)+'KB）。')
      : '解放できませんでした。データはそのまま残っています。';
    if(res.skipped && res.skipped.length){
      msg += ' 解放できなかったもの: ' + res.skipped.map(function(x){ return esc(x.unitId)+'('+esc(x.code)+')'; }).join(', ');
    }
    el('note').innerHTML = '<div class="note">'+msg+'</div>';
    renderCapacity();
    try { console.log('[home][v292Dfix660] 解放結果:', JSON.stringify(res)); } catch(e){}
  }
  if(el('gcBtn')) el('gcBtn').addEventListener('click', openGcPanel);

  el('upBtn').addEventListener('click', push);
  el('downBtn').addEventListener('click', function(){ pull(true); });
  el('expBtn').addEventListener('click', exportAll);
  el('impBtn').addEventListener('click', function(){ el('impFile').click(); });
  el('impFile').addEventListener('change', function(e){ var f=e.target.files&&e.target.files[0]; if(f) importFile(f); e.target.value=''; });

  /* ★fix588: 削除済みの物語URLを開くと fix527 がここへ戻す。
     無言で戻すと「開かないんだけど」になるので、理由を1行だけ出す。
     ★GPT裁定(A): 理由は**URLに載せない**。端末内の一回限りの通知（sessionStorage）で渡し、
       表示したら消す。alert は使わない（拡張の自動操作を固める前歴があるため）。 */
  var NOTICE_KEY = 'chr6_home_notice';
  function deletedNotice(){
    try {
      var msg = null;
      try { msg = sessionStorage.getItem(NOTICE_KEY); } catch(e){ msg = null; }
      if (!msg) return;
      try { sessionStorage.removeItem(NOTICE_KEY); } catch(e){}   /* 一回限り */
      var b = document.createElement('div');
      b.id = 'v588-deleted';
      b.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:9999;padding:10px 14px;'
        + 'background:#3a2a12;color:#f3e2c7;font-size:13px;line-height:1.5;'
        + 'border-bottom:1px solid #6b5228;text-align:center';
      b.textContent = String(msg).slice(0, 160);
      var x = document.createElement('button');
      x.type = 'button'; x.textContent = '×';
      x.style.cssText = 'margin-left:12px;background:transparent;border:0;color:inherit;cursor:pointer;font-size:15px';
      x.addEventListener('click', function(){ try { b.remove(); } catch(e){} });
      b.appendChild(x);
      document.body.appendChild(b);
      setTimeout(function(){ try { b.remove(); } catch(e){} }, 12000);
    } catch(e){}
  }

  /* ★★fix595(GPT裁定 Q2): 「homeで削除 → アプリを開くまでクラウド未反映」は、
     移行中の挙動としては許容できるが、**黙っていると他端末に削除済み物語が残り続ける**。
     保留が1件でもあるあいだは、ホームに常設で状態を出す。
     ここは表示だけで、localStorage へは1バイトも書かない（削除の所有者を増やさない）。 */
  /* ★★fix602: 「反映待ち」を人が読める言葉で出す。
     ①正本は fix587 の pendingDeletes() / stats()。localStorage を直接読むのは**保険**。
     ②止まっている削除（後片づけが進めない状態）も出す。件数が減らないのに理由が無いのが一番困る。
     ③**表示できない理由も黙らせない**（削除機能がまだ読めていない、等）。
     ④生の hash や技術用語（tombstone / deleteOpId / rev）は出さない。 */
  function pendingDeleteText(){
    var svc = lifecycleSvc();
    var n = null, st = null, svcMissing = false;
    try {
      if (svc && typeof svc.pendingDeletes === 'function'){
        var list = svc.pendingDeletes();
        n = Array.isArray(list) ? list.length : null;
      } else { svcMissing = true; }
    } catch(e){ n = null; }
    try { if (svc && typeof svc.stats === 'function') st = svc.stats(); } catch(e){ st = null; }
    if (n == null){
      /* 保険: サービスが答えられなくても、保留の記録があるなら件数だけは出す */
      try { var a = JSON.parse(localStorage.getItem('v292Dfix587_pending') || '[]'); n = Array.isArray(a) ? a.length : 0; } catch(e){ n = 0; }
    }
    var lines = [];
    if (n) lines.push('削除した物語が ' + n + '件、他の端末への反映待ちです。ゲーム画面を一度開くと同期されます。');
    if (st){
      var stuck = (+st.resumeBlocked || 0) + (+st.resumeRefused || 0);
      if (stuck) lines.push('削除の後片づけが' + stuck + '件残っています（内容が更新されたため確認が必要です）。');
      if (!n && (+st.pushFailures || 0)) lines.push('削除をクラウドへ伝えられませんでした。ゲーム画面を一度開くと、もう一度試します。');
    }
    if (svcMissing && (n || hasTombstone())){
      lines.push('削除の状況を確認できません（この画面の削除機能がまだ読み込めていません）。ページを再読み込みしてください。');
    }
    return lines.join(' ');
  }
  function pendingDeleteNotice(){
    try {
      var msg602 = pendingDeleteText();
      var old = document.getElementById('v595-pending');
      if (!msg602){ if (old) { try { old.remove(); } catch(e){} } return; }
      if (old) { old.firstChild.nodeValue = msg602; return; }
      var b = document.createElement('div');
      b.id = 'v595-pending';
      b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9998;padding:9px 14px;'
        + 'background:#12283a;color:#cfe4f3;font-size:13px;line-height:1.5;'
        + 'border-top:1px solid #285a7a;text-align:center';
      b.appendChild(document.createTextNode(msg602));
      var x = document.createElement('button');
      x.type = 'button'; x.textContent = '×';
      x.style.cssText = 'margin-left:12px;background:transparent;border:0;color:inherit;cursor:pointer;font-size:15px';
      x.addEventListener('click', function(){ try { b.remove(); } catch(e){} });
      b.appendChild(x);
      document.body.appendChild(b);
    } catch(e){}
  }

  /* ★fix602: 実機とテストから**読むだけ**の口。ここからは1バイトも書かない。
     判定を外から実際に動かせないと、テストが「実装の文字列」を見るだけになり、
     振る舞いが変わっても気づけない（fix588/fix591 で踏んだ型）。 */
  window.__v292Dfix602home = {
    __armed: true,
    isOff: f602off,
    tombstonedIds: tombstonedIds,
    hasTombstone: hasTombstone,
    slotIdOfKey: slotIdOfKey,
    classifierReady: classifierReady,
    incomingBarrier: incomingBarrier,
    isTombstonedSlotKey: isTombstonedSlotKey,
    allSlotIds: allSlotIds,
    collectLS: collectLS,
    pendingDeleteText: pendingDeleteText,
    lastPayloadDropped: function(){ return lastPayloadDropped; },
    PULL_HALT_CODE: PULL_HALT_CODE
  };

  /* ★★fix659: 物語画面の分岐バナー「☁ クラウド側を取り込む」から来たときは、
     ここで**一度だけ**強制取り込み(force=true, adoptCloud=true)を走らせる。
     ・クエリは pull を始める前に history.replaceState で落とす（リロード・戻るで再発火させない）。
     ・未ログインなら既存の noteNotLoggedIn() を出して終わる（黙って何もしないのが一番たちが悪い）。
     ・戻り値 true = この起動では通常の pull() を走らせない（二重 pull を作らない）。 */
  function autoPullOnce(){
    try {
      var m = String(location.search||'').match(/[?&]autopull=([^&#]*)/);
      if(!m) return false;
      /* ★autopull の**値**が「どの物語で分岐を解決するか」。旧形式の '1' や不正値のときは
         名指し無し＝強制取り込み(G1の解除)だけ行い、local-ahead保護は一切外さない(安全側・後方互換)。 */
      var want = '';
      try { want = decodeURIComponent(m[1]||''); } catch(e){ want = ''; }
      var adoptId = (want && want !== '1') ? want : null;
      try {
        if(window.history && history.replaceState){
          var q = String(location.search||'').replace(/([?&])autopull=[^&#]*&?/, '$1').replace(/[?&]$/, '');
          history.replaceState(null, '', location.pathname + q + (location.hash||''));
        }
      } catch(e){}
      if(!loggedIn()){ noteNotLoggedIn(); return true; }
      try { el('sync').className='sync'; el('sync').textContent='☁ 確認中…'; } catch(e){}
      try { console.log('[home][v292Dfix659] autopull: 分岐バナーからの取り込みを実行します', JSON.stringify({ adoptSlotId: adoptId })); } catch(e){}
      pull(true, adoptId);
      return true;
    } catch(e){ return false; }
  }

  // ---------- 起動 ----------
  fetch('version.txt?_='+Date.now(), {cache:'no-store'})
    .then(function(r){ return r.text(); })
    .then(function(t){ BUILD = (t||'').trim(); })
    .catch(function(){})
    .then(function(){ render(); f661AutoGC(); renderCapacity(); if(!autoPullOnce()) pull(); });
  render();
  deletedNotice();
  pendingDeleteNotice();
})();
</script>
