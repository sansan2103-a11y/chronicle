<!--
  backfill_harness.html — STEP C one-story backfill 専用の最小 harness（裁定 RULING18）

  ★このページは「何もしない」ことが仕様です。
    ・自動 getstory / 自動 putstory / timer / interval / auto backfill / candidate loop を持ちません。
    ・localStorage / sessionStorage へ 1 バイトも書きません。
    ・button から何かが自動実行されることもありません（button 自体を置いていません）。
    ・実行は開発者コンソールから window.__v292Dfix715.sendOne(...) を 1 回だけ呼ぶ形に限定します。

  ★読み込むのは production 実物の 2 本だけです。
      v292Dfix697-shadow-story-commit.js   （canonical projection / hash / transport の唯一の owner）
      v292Dfix715-onestory-backfill-sender.js（one-story sender harness）
    fix399 / fix402 / fix587 / fix590 / fix698 / lifecycle delete resume / HOME boot / index boot /
    legacy sync / autopull は **一切読み込みません**。したがって pull も resumePending も起動できません。

  ★fix697 の外部依存はすべて optional で、このページに無くても安全側に倒れます（静的確認済み）。
      window.__chronicleDocumentStoryKey  … 無い → storyId() = null → projection() = null
                                             → commit 経路がそもそも成立しない（このページでは望ましい）
      window.__chronicleGetState / window.S … 無い → S.save の wrap は成立しない
      window.__chronicleGoogleId          … 無い → home.html と同じ localStorage read-only fallback
      window.__v292Dfix247bapi            … 無い → 既定の proxy URL へ fallback
    fix697 の localStorage 書込は advanceDocRev の 1 箇所だけで、これは自 document の commit 成功時に
    しか呼ばれません。このページでは commit が成立しないため、書込は 0 です。

  ★一般 HOME / index からリンクしません。index.html / home.html へ script tag も追加しません。
-->
